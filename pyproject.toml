[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "discord-ai-bot"
version = "0.1.0"
description = "Discord AI bot routing messages to an LLM with per-channel memory, decoupled from discord.py so the core runs and tests offline."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Viprasol Tech Private Limited", email = "support@viprasol.com" }]
maintainers = [{ name = "Viprasol Tech Private Limited", email = "support@viprasol.com" }]
keywords = ["discord", "discord-bot", "ai", "llm", "chatbot", "conversational-ai", "bot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
discord = ["discord.py>=2.3"]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://viprasol.com"
Repository = "https://github.com/Viprasol-Tech/discord-ai-bot"
Issues = "https://github.com/Viprasol-Tech/discord-ai-bot/issues"
Changelog = "https://github.com/Viprasol-Tech/discord-ai-bot/blob/main/CHANGELOG.md"

[project.scripts]
discord-ai-bot = "discord_ai_bot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/discord_ai_bot"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ANN", "D"]
ignore = ["D203", "D213", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]
"examples/**" = ["D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_unused_configs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["discord", "discord.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
